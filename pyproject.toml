[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-xsr"
version = "1.0.2"
description = "A Python utility for recording screen interactions with custom cursors."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pre-commit>=3.5.0",
    "pynput>=1.7.6",
    "Pillow>=10.0.0",
    "fire>=0.5.0",
]

[project.scripts]
py-xsr = "py_xsr.py_xsr:run_recorder"

[tool.hatch.build.targets.wheel]
packages = ["py_xsr"]
